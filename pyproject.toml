[project]
name = "hatchling-version-source-env"
dynamic = ["version"]
description = "A version source for Hatchling that reads the version from a given environment variable, but also allows for a fallback if the variable is not populated."
authors = [
    { name = "Jens Keiner", email = "jens.keiner@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
classifiers = [
	"Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Operating System :: OS Independent",
]
dependencies = [
    # Package dependencies go here, e.g.
    # "pandas>=1,<3",
]

[project.urls]
homepage = "https://github.com/jenskeiner/hatchling_version_source_env/"
repository = "https://github.com/jenskeiner/hatchling_version_source_env.git"
documentation = "https://github.com/jenskeiner/hatchling_version_source_env/"
issues = "https://github.com/jenskeiner/hatchling_version_source_env/issues"

[dependency-groups]
dev = [
    "hatchling>=1.21.1",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
]

[build-system]
requires = ["hatchling>=1.21.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
  "src/hatchling_version_source_env/**",
  "tests/**",
]
exclude = [
  ".github",
  ".pre-commit-config.yaml",
]

[tool.hatch.build.targets.wheel]
sources = ["src"]
only-include = ["src/hatchling_version_source_env"]

[tool.hatch.version]
source = "env"
variable = "PACKAGE_VERSION"

[tool.pytest.ini_options]
addopts = "--cov=hatchling_version_source_env --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]
